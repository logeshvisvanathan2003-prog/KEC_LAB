services:
  - type: web
    name: kce-lab-backend
    runtime: python
    rootDir: api
    buildCommand: pip install -r ../requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false          # Set this manually in Render dashboard
      - key: JWT_SECRET_KEY
        sync: false          # Set this manually in Render dashboard
      - key: AGENT_SECRET
        sync: false          # Set this manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # Set to your Vercel URL e.g. https://kce-lab.vercel.app
    healthCheckPath: /api/health
